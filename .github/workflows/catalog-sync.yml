# Nightly catalog sync — chunk driver.
#
# NCR/Freshop rate-limits datacenter IPs, so the sync endpoint processes only a
# few catalog pages per call and checkpoints in the database. First kick is
# 12:30 AM Central (after Sinclair's midnight catalog rebuild). This workflow
# then pokes production every 15 minutes until the run reports "done".
#
# Setup (one time): add repo secret CRON_SECRET with the same value as the
# CRON_SECRET environment variable in Vercel.

name: Nightly catalog sync

on:
  schedule:
    # 12:30 AM America/Chicago = 05:30 UTC (CDT) / 06:30 UTC (CST).
    # Sinclair's rebuilds ~midnight–12:15 AM Central — 12:30 is after that.
    - cron: '30 5 * * *'
    - cron: '30 6 * * *'
    # Then every 15 min until ~5:45 AM Central so 123 pages can finish.
    - cron: '*/15 6-10 * * *'
  workflow_dispatch: {}   # manual "Run workflow" button for testing

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync chunk
        run: |
          curl -sS -X POST "https://graftontowboatservices.com/api/cron/catalog-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 90 \
            -w "\nHTTP %{http_code}\n"
