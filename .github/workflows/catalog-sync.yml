# Nightly catalog sync — chunk driver.
#
# NCR/Freshop rate-limits datacenter IPs, so the sync endpoint processes only a
# few catalog pages per call and checkpoints in the database. Vercel's cron
# kicks the first chunk at 12:05am Central; this workflow keeps poking the
# endpoint every 15 minutes through the night until the run reports "done"
# (already-done invocations are instant no-ops).
#
# Setup (one time): add repo secret CRON_SECRET with the same value as the
# CRON_SECRET environment variable in Vercel.

name: Nightly catalog sync

on:
  schedule:
    # Every 15 min, 07:00–11:45 UTC (≈ 2am–6:45am Central).
    #
    # DO NOT MOVE EARLIER. Sinclair's rebuilds their catalog between midnight
    # and ~12:15 AM Central. This used to start at 05:00 UTC (midnight Central),
    # straight into the rebuild — the sweep sized departments off half-built
    # data, locked those short totals into the session, and imported a slice of
    # the store while reporting success. Observed: store sized at 775 when
    # Bakery alone reports 1,820.
    #
    # The very first sweep (full-store import) may take two nights; the
    # checkpoint carries over automatically.
    - cron: '*/15 7-11 * * *'
  workflow_dispatch: {}   # manual "Run workflow" button for testing

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync chunk
        run: |
          curl -sS -X POST "https://grafton-towboatsrepo.vercel.app/api/cron/catalog-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 90 \
            -w "\nHTTP %{http_code}\n"
